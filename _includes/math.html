{%- comment -%} MathJax 3 incl. AMS environments (part of the base bundle) and mhchem (\ce{...}). {%- endcomment -%}
<script>
  window.MathJax = {
    loader: { load: ['[tex]/mhchem'] },
    tex: {
      inlineMath: [['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      packages: { '[+]': ['mhchem'] },
      tags: 'ams'
    },
    options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
  };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

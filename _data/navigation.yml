      - title: { en: About, de: Über uns }
        children:
          - title: { en: Contact, de: Kontakt }
            url: /contact/
          - title: { en: Imprint, de: Impressum }
            url: /imprint/
  - title: { en: Docs, de: Dokumentation }
    url: https://pandapower.readthedocs.io
    external: true
